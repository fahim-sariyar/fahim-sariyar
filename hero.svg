<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-label="Fahim Sariyar — Frontend Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Fahim Sariyar — Frontend Developer</title><desc>Animated hero: name, cycling roles and details, with a video panel on the right.</desc><defs><style>
text{font-family:ui-monospace,Menlo,Consolas,monospace}
.sg{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:700}
.sgm{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:500}
.jb{font-family:ui-monospace,Menlo,Consolas,monospace}
.jbb{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fu{animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both}
.fi{animation:fadeIn .7s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
.role{animation:role 12s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes role{0%{opacity:0;transform:translateY(16px)}4%{opacity:1;transform:translateY(0)}22%{opacity:1;transform:translateY(0)}25.5%{opacity:0;transform:translateY(-16px)}100%{opacity:0;transform:translateY(-16px)}}
.blob{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(40px,-30px)}}
.blob2{animation:drift2 16s ease-in-out infinite alternate}
@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-50px,26px)}}
.corner{stroke-dasharray:60;animation:draw .8s ease both}
@keyframes draw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
</style>
<linearGradient id="nameG" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
  <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-.35 0;.35 0;-.35 0" dur="7s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="nameG2" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
</linearGradient>
<linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#000"/><stop offset=".26" stop-color="#fff"/><stop offset="1" stop-color="#fff"/>
</linearGradient>
<linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fff"/><stop offset=".86" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
</linearGradient>
<mask id="vmask" maskUnits="userSpaceOnUse" x="560" y="0" width="724" height="540">
  <rect x="560" y="0" width="724" height="540" fill="url(#fadeL)"/>
</mask>
<mask id="vmaskB" maskUnits="userSpaceOnUse" x="560" y="0" width="724" height="540">
  <rect x="560" y="0" width="724" height="540" fill="url(#fadeB)"/>
</mask>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="13" cy="13" r=".9" fill="#ffffff" fill-opacity=".06"/></pattern>
<filter id="blur60" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><rect width="1280" height="540" rx="26"/></clipPath>
<clipPath id="hiClip"><rect x="60" y="130" width="330" height="46"><animate attributeName="width" values="0;0;330" keyTimes="0;.4167;1" dur="1.2s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;.3 0 .2 1"/></rect></clipPath>
<clipPath id="nameClip"><rect x="50" y="170" width="640" height="100"><animate attributeName="y" values="262;262;170" keyTimes="0;.5263;1" dur="1.9s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1"/></rect></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="1280" height="540" fill="#0d0e16"/>
  <rect width="1280" height="540" fill="url(#dots)"/>
  <g filter="url(#blur60)" opacity=".55">
    <circle class="blob" cx="170" cy="120" r="150" fill="#22d3ee" fill-opacity=".22"/>
    <circle class="blob2" cx="470" cy="470" r="170" fill="#a78bfa" fill-opacity=".22"/>
    <circle class="blob" cx="1150" cy="80" r="130" fill="#f472b6" fill-opacity=".14"/>
  </g>
 
  <!-- VIDEO PANEL (placeholder).
       The original had ~50 base64 JPEG frames here, each as:
       <image x="560" y="0" width="724" height="540" href="data:image/jpeg;base64,..." preserveAspectRatio="none">
         <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="..." dur="4.0s" repeatCount="indefinite"/>
       </image>
       Paste them back inside the inner <g> below to restore the walking/waving animation. -->
  <g mask="url(#vmask)"><g mask="url(#vmaskB)">
    <g>
      <rect x="560" y="0" width="724" height="540" fill="#151728"/>
      <circle cx="930" cy="200" r="70" fill="#a78bfa" fill-opacity=".25"/>
      <rect x="860" y="290" width="140" height="170" rx="60" fill="#22d3ee" fill-opacity=".2"/>
    </g>
  </g></g>
 
  <!-- viewfinder HUD -->
  <path class="corner" d="M760 74V40H794" fill="none" stroke="#eceef6" stroke-opacity=".7" stroke-width="2.2" stroke-linecap="round" style="animation-delay:0.3s"/><path class="corner" d="M1236 74V40H1202" fill="none" stroke="#eceef6" stroke-opacity=".7" stroke-width="2.2" stroke-linecap="round" style="animation-delay:0.38s"/><path class="corner" d="M760 466V500H794" fill="none" stroke="#eceef6" stroke-opacity=".7" stroke-width="2.2" stroke-linecap="round" style="animation-delay:0.46s"/><path class="corner" d="M1236 466V500H1202" fill="none" stroke="#eceef6" stroke-opacity=".7" stroke-width="2.2" stroke-linecap="round" style="animation-delay:0.54s"/>
  <g class="fi" style="animation-delay:.6s">
    <circle cx="782" cy="483" r="5" fill="#ef4444"><animate attributeName="opacity" values="1;.15;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <text class="jbb" x="794" y="488" font-size="13" fill="#eceef6" letter-spacing="2">REC</text>
    <text class="jb" x="1222" y="488" font-size="12" fill="#8d93ab" text-anchor="end" letter-spacing="1.5">HELLO.MP4 &#183; 24FPS</text>
  </g>
  <g class="fi" style="animation-delay:.8s">
    <rect x="760" y="516" width="476" height="3" rx="1.5" fill="#ffffff" fill-opacity=".12"/>
    <rect x="760" y="516" width="0" height="3" rx="1.5" fill="url(#nameG2)">
      <animate attributeName="width" values="0;476" dur="4.0s" repeatCount="indefinite"/>
    </rect>
  </g>
 
  <!-- LEFT COPY -->
  <g class="fu" style="animation-delay:.2s">
    <rect x="64" y="64" width="236" height="32" rx="16" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-opacity=".45"/>
    <circle cx="84" cy="80" r="4.5" fill="#34d399"/>
    <circle cx="84" cy="80" r="4" fill="none" stroke="#34d399" stroke-width="1.5"><animate attributeName="r" values="4;11" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="1.6s" repeatCount="indefinite"/></circle>
    <text class="jbb" x="98" y="85" font-size="12" fill="#34d399" letter-spacing="1.6">OPEN TO COLLABS</text>
  </g>
  <text clip-path="url(#hiClip)" class="sgm" x="64" y="164" font-size="30" fill="#eceef6">Hi there, I'm</text>
  <g clip-path="url(#nameClip)">
    <text class="sg" x="60" y="250" font-size="76" letter-spacing="-1.5" fill="url(#nameG)" filter="url(#glow)">Fahim Sariyar</text>
  </g>
  <rect x="64" y="272" width="120" height="3" rx="1.5" fill="url(#nameG2)"><animate attributeName="width" values="0;0;120" keyTimes="0;.68;1" dur="2.5s" begin="0s" fill="freeze"/></rect>
  <text class="jbb fi" x="64" y="340" font-size="21" fill="#22d3ee" style="animation-delay:1.8s">&gt;</text>
  <text class="role jb" x="92" y="340" font-size="21" fill="#eceef6" opacity="1" style="animation-delay:1.9s">Frontend Developer</text><text class="role jb" x="92" y="340" font-size="21" fill="#eceef6" opacity="0" style="animation-delay:4.9s">Motion &amp; GSAP Animator</text><text class="role jb" x="92" y="340" font-size="21" fill="#eceef6" opacity="0" style="animation-delay:7.9s">Anime Web Experiences</text><text class="role jb" x="92" y="340" font-size="21" fill="#eceef6" opacity="0" style="animation-delay:10.9s">AI-Assisted Builder</text>
  <text class="sgm fu" x="64" y="392" font-size="18" fill="#8d93ab" style="animation-delay:2.5s">Crafting fast, responsive interfaces and cinematic,</text>
  <text class="sgm fu" x="64" y="418" font-size="18" fill="#8d93ab" style="animation-delay:2.62s">anime-inspired web experiences with React &amp; GSAP.</text>
  <g class="fu" style="animation-delay:3.0s"><g transform="translate(72,453)"><path d="M0-8a6 6 0 0 1 6 6c0 4.5-6 10-6 10s-6-5.5-6-10a6 6 0 0 1 6-6z" fill="none" stroke="#22d3ee" stroke-width="1.8"/><circle cy="-2" r="2" fill="#22d3ee"/></g><text class="jb" x="88" y="458" font-size="14.5" fill="#8d93ab">Dhaka,Bangladesh </text></g><g class="fu" style="animation-delay:3.15s"><g transform="translate(244,453)"><rect x="-7" y="-5" width="14" height="11" rx="2" fill="none" stroke="#a78bfa" stroke-width="1.8"/><path d="M-3-5v-2.5h6V-5" fill="none" stroke="#a78bfa" stroke-width="1.8"/></g><text class="jb" x="260" y="458" font-size="14.5" fill="#8d93ab">Wiley</text></g><g class="fu" style="animation-delay:3.3s"><g transform="translate(352,453)"><path d="M0-8l2.4 5 5.4.6-4 3.7 1.1 5.4L0 4 -4.9 6.7-3.8 1.3-7.8-2.4l5.4-.6z" fill="none" stroke="#f472b6" stroke-width="1.7" stroke-linejoin="round"/></g><text class="jb" x="368" y="458" font-size="14.5" fill="#8d93ab">54 stars &#183; 8 repos</text></g>
</g>
<rect x=".75" y=".75" width="1278.5" height="538.5" rx="25.5" fill="none" stroke="#262a42" stroke-width="1.5"/>
</svg>
 
